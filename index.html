<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Inn Batang | Penginapan Nyaman Near Exit Tol</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #1e40af; 
            --gold: #d97706; 
            --dark: #1f2937;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family:'Inter',sans-serif; 
            background:#f8fafc; 
            color:#1f2937; 
            line-height:1.6; 
        }
        .heading { font-family:'Playfair Display',serif; }

        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), 
                        url('https://i.imgur.com/KfmEoXQ.jpeg') center/cover no-repeat;
            color: white;
            display: flex;
            align-items: center;
            text-align: center;
        }

        .btn { 
            padding: 14px 36px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-primary { 
            background: var(--primary); 
            color: white; 
        }
        .btn-primary:hover { 
            background: #1e3a8a; 
        }

        .room-card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            transition: 0.4s; 
        }
        .room-card:hover { 
            transform: translateY(-10px); 
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
            padding: 20px 0;
        }
        .gallery img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            transition: 0.4s;
        }
        .gallery img:hover {
            transform: scale(1.04);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
        }
        .modal-content { 
            background: white; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 480px; 
            padding: 28px; 
            max-height: 95vh; 
            overflow-y: auto; 
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav style="background:white; box-shadow:0 4px 20px rgba(0,0,0,0.08); padding:18px 24px; position:sticky; top:0; z-index:1000;">
    <div style="max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="https://i.imgur.com/8iuciXN.jpeg" alt="Family Inn Logo" style="height:65px; border-radius:8px;">
            <div>
                <span class="heading" style="font-size:1.95rem; color:#1e40af;">Family Inn</span>
                <small style="display:block; color:#666; font-size:0.9rem;">Near Exit Tol Batang</small>
            </div>
        </div>
        <a href="admin.html" target="_blank" class="btn btn-primary">Admin Panel</a>
    </div>
</nav>

<!-- Hero, Kamar, Galeri, Fasilitas, Footer tetap sama seperti sebelumnya -->
<!-- (Saya ringkas agar tidak terlalu panjang, tapi kamu bisa copy dari file lama kamu) -->

<!-- Modal Booking -->
<div id="bookingModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px; text-align:center;">Pesan Kamar</h3>
        
        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Pilih Paket</label>
            <select id="paketSelect" onchange="setPaket(this.value)" 
                    style="width:100%; padding:14px; border:2px solid #ddd; border-radius:10px; font-size:1rem;">
                <option value="Harian">Harian — Rp 170.000 / malam</option>
                <option value="4 Jam">Transit 4 Jam — Rp 100.000</option>
            </select>
        </div>

        <div id="formContent"></div>

        <button onclick="submitBooking()" 
                style="width:100%; margin-top:25px; background:#d97706; color:white; padding:16px; border:none; border-radius:12px; font-size:1.1rem; font-weight:700;">
            Kirim Reservasi via WhatsApp
        </button>
        <button onclick="closeModal()" 
                style="width:100%; margin-top:10px; background:#e5e7eb; padding:12px; border:none; border-radius:12px;">
            Batal
        </button>
    </div>
</div>

<script>
// ==================== SUPABASE CONFIG ====================
const SB_URL = "https://zqjornnetlotrljcieam.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxam9ybm5ldGxvdHJsamNpZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NDA4MzIsImV4cCI6MjA5MzAxNjgzMn0.Ey5b9lHuAsKKJG9UirDSf3GUBNxU3yi_BarTM3ytx6w";

let currentPaket = "Harian";

function openModal() {
    document.getElementById('bookingModal').style.display = 'flex';
    setPaket('Harian');
}

function closeModal() {
    document.getElementById('bookingModal').style.display = 'none';
}

function setPaket(paket) {
    currentPaket = paket;
    
    let html = `
        <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Nama Tamu</label>
            <input type="text" id="nama" style="width:100%; padding:12px; border:2px solid #ddd; border-radius:10px;" placeholder="Nama lengkap">
        </div>
        <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:6px; font-weight:600;">Nomor WhatsApp</label>
            <input type="tel" id="wa" style="width:100%; padding:12px; border:2px solid #ddd; border-radius:10px;" placeholder="082133851456">
        </div>`;

    if (paket === "Harian") {
        html += `
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:6px; font-weight:600;">Tanggal & Jam Check-in (24 Jam)</label>
                <input type="datetime-local" id="checkin" style="width:100%; padding:12px; border:2px solid #ddd; border-radius:10px;">
            </div>
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:6px; font-weight:600;">Jumlah Malam</label>
                <input type="number" id="malam" value="1" min="1" style="width:100%; padding:12px; border:2px solid #ddd; border-radius:10px;">
            </div>`;
    } else {
        html += `
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:6px; font-weight:600;">Tanggal & Jam Masuk (24 Jam)</label>
                <input type="datetime-local" id="checkin" style="width:100%; padding:12px; border:2px solid #ddd; border-radius:10px;">
            </div>`;
    }
    document.getElementById('formContent').innerHTML = html;
}

async function submitBooking() {
    const nama = document.getElementById('nama').value.trim();
    const wa = document.getElementById('wa').value.trim();
    const checkinStr = document.getElementById('checkin').value;

    if (!nama || !wa || !checkinStr) {
        alert("❌ Mohon isi Nama, Nomor WhatsApp, dan Tanggal & Jam Check-in!");
        return;
    }

    const checkinDate = new Date(checkinStr);
    let checkoutDate = new Date(checkinDate);
    let malam = 0;
    let total = currentPaket === "Harian" ? 170000 : 100000;

    if (currentPaket === "Harian") {
        malam = parseInt(document.getElementById('malam').value) || 1;
        checkoutDate.setDate(checkoutDate.getDate() + malam);
        total = malam * 170000;
    } else {
        checkoutDate.setHours(checkoutDate.getHours() + 4);
    }

    // Buat pesan WhatsApp yang rapi
    const checkinFormatted = new Date(checkinDate).toLocaleString('id-ID', {
        day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    const checkoutFormatted = new Date(checkoutDate).toLocaleString('id-ID', {
        day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const waText = `Halo Family Inn,%0A%0A` +
        `*Nama:* ${nama}%0A` +
        `*WA:* ${wa}%0A` +
        `*Kamar:* Standard Room%0A` +
        `*Paket:* ${currentPaket}%0A` +
        `*Check-in:* ${checkinFormatted}%0A` +
        `*Check-out:* ${checkoutFormatted}%0A` +
        `${currentPaket === "Harian" ? `*Jumlah Malam:* ${malam} malam%0A` : ''}` +
        `*Total:* Rp ${total.toLocaleString('id-ID')}%0A%0A` +
        `Mohon konfirmasi ketersediaan dan status reservasi. Terima kasih! 🙏`;

    const whatsappURL = `https://wa.me/6282133851456?text=${encodeURIComponent(waText)}`;

    // === TEKNIK KHUSUS iOS ===
    alert("✅ Reservasi berhasil!\n\nSedang membuka WhatsApp...");

    // Cara 1: Langsung redirect (paling efektif di iOS)
    setTimeout(() => {
        window.location.href = whatsappURL;
    }, 500);

    // Cara 2: Fallback jika masih tidak terbuka
    setTimeout(() => {
        window.open(whatsappURL, '_blank');
    }, 1500);

    // Simpan ke database di background
    setTimeout(async () => {
        const payload = {
            nama: nama,
            wa: wa,
            kamar: "Standard Room",
            tipe_sewa: currentPaket,
            checkin: checkinDate.toISOString(),
            checkout: checkoutDate.toISOString(),
            malam: malam,
            total: total,
            catatan: "Booking dari website"
        };

        try {
            await fetch(`${SB_URL}/rest/v1/reservasi`, {
                method: 'POST',
                headers: {
                    'apikey': SB_KEY,
                    'Authorization': `Bearer ${SB_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            console.log("Data tersimpan ke database");
        } catch (e) {
            console.error("Gagal simpan database:", e);
        }
    }, 800);

    closeModal();
}

// Set default waktu
setTimeout(() => {
    const now = new Date();
    now.setMinutes(Math.ceil(now.getMinutes() / 15) * 15);
    const defaultTime = now.toISOString().slice(0,16);
    const checkinInput = document.getElementById('checkin');
    if (checkinInput) checkinInput.value = defaultTime;
}, 500);
</script>
</body>
</html>
